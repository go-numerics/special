name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The fleet's CI shape (go-ndarray/ndarray): a 100% statement-coverage gate
# with -race on three operating systems, native amd64/arm64 execution, the
# other 64-bit architectures and 32-bit arm under qemu (386 natively), every
# GOOS/GOARCH pair compiling the tests, and govulncheck.
#
# The accuracy fixtures (testdata/fixtures, generated from mpmath) run in
# every execution lane: the per-region ULP budgets in the *_test.go files are
# the regression guard, and they must hold on every architecture, including
# those where Go fuses multiply-adds (arm64, ppc64le, s390x, riscv64,
# loong64) and those where it does not (amd64, 386, arm). Since every float
# product is rounded explicitly or fused through math.FMA (tools/fmalint
# enforces it), the results are also the same bits on every architecture:
# TestArchHash compares them with testdata/archhash.golden in each lane.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: No float product open to multiply-add fusion (tools/fmalint)
        run: |
          go -C tools test ./fmalint ./testbudget ./mutgate
          go -C tools run ./fmalint -C .. . ./dd ./cmplx ./nd ./internal/libm
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          # internal/libm is generated from Go's src/math (tools/fmalint
          # --genlibm, checked up to date by the fmalint tests); two of its
          # branches (log1p for k == 0 with |f| < 2^-20) are unreachable in
          # Go's own code, so it is tested on its own and kept out of the gate.
          COVERPKG=$(go list ./... | grep -v /internal/libm | paste -sd, -)
          # -timeout 30m: the default 10m killed the windows lane (a suite at
          # 9 min under -race, three times flagged as near its limit); the
          # budget below makes the creep visible long before 30m. 13m is 1.5x
          # the windows time of 2026-11-12 (8.7 min); -json goes to a file,
          # tools/testbudget prints the failed tests' output and the slowest.
          status=0
          go test -race -timeout 30m -json -coverpkg="$COVERPKG" -coverprofile=cover.out ./... > "$RUNNER_TEMP/test.json" || status=$?
          budget=0
          go -C tools run ./testbudget --package github.com/go-numerics/special --budget 13m "$RUNNER_TEMP/test.json" || budget=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [ "$budget" -ne 0 ]; then exit "$budget"; fi
          go tool cover -func=cover.out | tail -n 40
          # go tool cover's total is rounded to one decimal (99.95 reads 100.0);
          # covblocks counts the blocks the profile never entered (exit 1 if
          # any, exit 2 on an empty or unreadable profile).
          go run github.com/go-fleettools/fleettools/cmd/covblocks@v0.104.0 cover.out

  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - run: go env GOARCH
      - name: Vet + build + run (accuracy fixtures included)
        run: |
          go vet ./...
          go build ./...
          go test ./...
      # The binary witness: on arm64 every fused multiply-add the compiler
      # emitted must come from a math.FMA call (tools/fmalint --objdump).
      - name: No implicit fused multiply-add in the arm64 binaries
        if: matrix.label == 'arm64'
        run: |
          for p in . ./dd ./cmplx ./nd ./internal/libm; do
            go test -c -o "$RUNNER_TEMP/w.test" "$p"
            go tool objdump "$RUNNER_TEMP/w.test" > "$RUNNER_TEMP/w.txt"
            go -C tools run ./fmalint -C .. --objdump "$RUNNER_TEMP/w.txt"
          done

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
          # 32-bit: int is 32 bits.
          - { goarch: arm,     qemu: qemu-arm-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Vet + test under qemu (${{ matrix.goarch }})
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for
          # an architecture it never ran is the one outcome this matrix exists to
          # rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          GOARCH=${{ matrix.goarch }} go test -timeout 30m -exec="$q" ./...

  # 386 runs natively on the amd64 runner (the kernel executes 32-bit x86
  # binaries), not under qemu-i386, whose emulation loses x87/SSE state across
  # preemption.
  arch-386:
    name: arch 386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - name: Vet + test (GOARCH=386)
        run: |
          GOARCH=386 go vet ./...
          GOARCH=386 go test ./...

  # Every GOOS/GOARCH pair Go supports must at least compile the library's
  # tests: a test that does not compile on a target is a test that never
  # runs there, and nothing else would notice.
  cross-compile:
    name: compile tests on every target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - name: go test -c (go vet on android/ios) for each go tool dist list pair
        run: |
          fail=0
          for t in $(go tool dist list); do
            os=${t%/*}; arch=${t#*/}
            # android/ios refuse to build without a cgo linker, even for vet;
            # with cgo nominally on and CC=false, vet type-checks the package
            # and its tests (there is no import "C" to compile).
            case $os in android|ios) mode="vet" ;; *) mode="test" ;; esac
            for p in $(go list ./...); do
              if [ $mode = test ]; then
                out=$(CGO_ENABLED=0 GOOS=$os GOARCH=$arch go test -c -o /dev/null "$p" 2>&1) || { echo "::error::$t $p: $out"; fail=1; }
              else
                out=$(CGO_ENABLED=1 CC=false GOOS=$os GOARCH=$arch go vet "$p" 2>&1) || { echo "::error::$t $p: $out"; fail=1; }
              fi
            done
          done
          exit $fail

  # refbench's CI mode (go-scikit/refbench v0.1.1; no Python, no timing): the
  # allocation count of every case equals docs/perf.json, docs/perf-table.md is
  # what perf.json generates, and every public function has a case or an entry
  # in docs/perf-exempt.md. Timing runs by hand at a 1-minute load below 8:
  # cd bench && go test -run TestPerf -cpu 1 -perf.run .
  perf:
    name: perf (refbench CI mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - name: Allocation counts, table, public-function inventory
        working-directory: bench
        run: go test -count=1 -run TestPerf -cpu 1 .

  # The guards of every *_fast.go are held by an assertion, not by luck:
  # mutsweep (go-fleettools/mutate v0.8.0) moves each comparison one step
  # (-mutate boundary: < to <=, > to >=) and deletes each refusal in turn, and
  # tools/mutgate fails on any SURVIVED, HUNG, caught-by-PANIC or NOT RUN
  # target that mutation-allowlist.json does not list with its reason (and on a
  # listed entry nothing matches any more). special#71, #73 and #72 were range
  # guards held only by an index panic; that verdict is a failure here.
  # -timeout 3m per mutant: mutsweep refuses anything under 3x the baseline
  # run of `go test .` (about 10 s), and prints the baseline.
  mutation:
    name: mutation gate (mutsweep, *_fast.go)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # mutate v0.8.0 requires go >= 1.27.4 (GOTOOLCHAIN=local refuses 1.27.3)
          go-version: 1.27.4
      - name: Install mutate and mutsweep v0.8.0
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/go-fleettools/mutate@v0.8.0
          GOBIN="$RUNNER_TEMP/bin" go install github.com/go-fleettools/mutate/mutsweep@v0.8.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Sweep every *_fast.go, both modes (tools/mutgate)
        run: go -C tools run ./mutgate -C .. --allowlist ../mutation-allowlist.json --timeout 3m

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
